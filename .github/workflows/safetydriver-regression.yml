name: SafetyDriver - pitch and alarm regression
on:
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/safetydriver-regression.yml'
  push:
    branches:
      - 'fix/alert-audio-head-pitch-20261123'

jobs:
  typescript-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run check

  android-native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Compile native Android app
        working-directory: mobile-app/android
        run: ./gradlew :app:assembleDebug --no-daemon
